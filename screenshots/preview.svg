<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 900" width="420" height="900">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1565C0" />
      <stop offset="50%" stop-color="#1976D2" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <filter id="heroShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0D47A1" flood-opacity="0.28" />
    </filter>
  </defs>

  <!-- Device Frame -->
  <rect x="10" y="10" width="400" height="880" rx="44" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="4"/>

  <!-- Status Bar -->
  <text x="44" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#0F172A">9:41</text>
  <circle cx="340" cy="38" r="4" fill="#0F172A" />
  <circle cx="354" cy="38" r="5" fill="#0F172A" />
  <rect x="366" y="33" width="18" height="10" rx="3" fill="none" stroke="#0F172A" stroke-width="2"/>
  <rect x="368" y="35" width="12" height="6" rx="1.5" fill="#0F172A" />

  <!-- App Header -->
  <g transform="translate(0, 60)">
    <circle cx="210" cy="24" r="26" fill="#E3F2FD"/>
    <!-- Calculator Icon -->
    <rect x="198" y="12" width="24" height="24" rx="4" fill="none" stroke="#1976D2" stroke-width="2.2"/>
    <line x1="202" y1="18" x2="218" y2="18" stroke="#1976D2" stroke-width="2"/>
    <circle cx="204" cy="24" r="1.5" fill="#1976D2"/>
    <circle cx="210" cy="24" r="1.5" fill="#1976D2"/>
    <circle cx="216" cy="24" r="1.5" fill="#1976D2"/>
    <circle cx="204" cy="30" r="1.5" fill="#1976D2"/>
    <circle cx="210" cy="30" r="1.5" fill="#1976D2"/>
    <circle cx="216" cy="30" r="1.5" fill="#1976D2"/>

    <text x="210" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="-0.5">Tip Calculator</text>
    <text x="210" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748B" text-anchor="middle">Calculate your bill and split expenses easily.</text>
  </g>

  <!-- Hero Result Card -->
  <g transform="translate(28, 164)">
    <rect x="0" y="0" width="364" height="240" rx="22" fill="url(#cardGradient)" filter="url(#heroShadow)"/>
    
    <!-- Header inside Card -->
    <text x="20" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="rgba(255,255,255,0.7)">Payment Breakdown</text>
    <!-- Reset badge -->
    <rect x="296" y="14" width="48" height="20" rx="10" fill="rgba(255,255,255,0.18)"/>
    <text x="320" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reset</text>

    <!-- Inner Hero Box for Amount Per Person -->
    <rect x="18" y="44" width="328" height="82" rx="16" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.22)" stroke-width="1"/>
    <text x="182" y="64" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="rgba(255,255,255,0.75)" text-anchor="middle" letter-spacing="1">AMOUNT PER PERSON</text>
    <text x="182" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" text-anchor="middle">₹550.00</text>
    <text x="182" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="rgba(255,255,255,0.7)" text-anchor="middle">Equally split among 2 people</text>

    <!-- Divider -->
    <line x1="20" y1="138" x2="344" y2="138" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

    <!-- Breakdown items -->
    <text x="20" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.75)">1. Bill Amount</text>
    <text x="344" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end">₹1000.00</text>

    <text x="20" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.75)">2. Tip Percentage</text>
    <text x="344" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end">10%</text>

    <text x="20" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.75)">3. Total Tip Amount</text>
    <text x="344" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end">₹100.00</text>

    <text x="20" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.75)">4. Total Bill</text>
    <text x="344" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="end">₹1100.00</text>

    <text x="20" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">5. Amount Per Person</text>
    <text x="344" y="228" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF" text-anchor="end">₹550.00</text>
  </g>

  <!-- Bill Amount Input Card -->
  <g transform="translate(28, 420)">
    <rect x="0" y="0" width="364" height="106" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Bill Amount</text>

    <!-- Input Box -->
    <rect x="18" y="42" width="328" height="48" rx="12" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
    <text x="34" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#1976D2">₹</text>
    <text x="60" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#0F172A">1000</text>
  </g>

  <!-- Tip Percentage Slider Card -->
  <g transform="translate(28, 542)">
    <rect x="0" y="0" width="364" height="142" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Tip Percentage</text>
    <!-- Badge -->
    <rect x="306" y="14" width="40" height="22" rx="11" fill="#1976D2"/>
    <text x="326" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">10%</text>

    <!-- Slider Bar -->
    <rect x="18" y="56" width="328" height="6" rx="3" fill="#E3F2FD"/>
    <rect x="18" y="56" width="109" height="6" rx="3" fill="#1976D2"/>
    <circle cx="127" cy="59" r="10" fill="#0D47A1" stroke="#FFFFFF" stroke-width="2"/>

    <text x="18" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#64748B">0%</text>
    <text x="182" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748B" text-anchor="middle">15%</text>
    <text x="346" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" text-anchor="end">30%</text>

    <!-- Chips -->
    <g transform="translate(18, 92)">
      <!-- 0% -->
      <rect x="0" y="0" width="46" height="26" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="23" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">0%</text>
      <!-- 5% -->
      <rect x="54" y="0" width="46" height="26" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="77" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">5%</text>
      <!-- 10% Selected -->
      <rect x="108" y="0" width="48" height="26" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
      <text x="132" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#1976D2" text-anchor="middle">10%</text>
      <!-- 15% -->
      <rect x="164" y="0" width="48" height="26" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="188" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">15%</text>
      <!-- 20% -->
      <rect x="220" y="0" width="48" height="26" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="244" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">20%</text>
      <!-- 25% -->
      <rect x="276" y="0" width="48" height="26" rx="8" fill="#F1F5F9" stroke="#E2E8F0"/>
      <text x="300" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748B" text-anchor="middle">25%</text>
    </g>
  </g>

  <!-- Split Bill Card -->
  <g transform="translate(28, 700)">
    <rect x="0" y="0" width="364" height="110" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    <text x="18" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0F172A">Split Bill</text>

    <!-- Details Left -->
    <text x="18" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#0F172A">2 People</text>
    <text x="18" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Split expense evenly</text>

    <!-- Counter Controls Right -->
    <rect x="238" y="44" width="108" height="42" rx="12" fill="#F1F5F9" stroke="#E2E8F0"/>
    <!-- Minus Button -->
    <rect x="242" y="48" width="34" height="34" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <line x1="253" y1="65" x2="265" y2="65" stroke="#1976D2" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Count -->
    <text x="292" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#1976D2" text-anchor="middle">2</text>
    <!-- Plus Button -->
    <rect x="308" y="48" width="34" height="34" rx="9" fill="#FFFFFF" stroke="#E2E8F0"/>
    <line x1="319" y1="65" x2="331" y2="65" stroke="#1976D2" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="325" y1="59" x2="325" y2="71" stroke="#1976D2" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Footer Tag -->
  <text x="210" y="852" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">Tip Calculator • Material 3 • Flutter Internship</text>
</svg>

